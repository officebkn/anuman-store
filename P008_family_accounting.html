<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Accounting - P008</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet"><style>*{font-family:'Kanit',sans-serif;box-sizing:border-box;margin:0;padding:0}body{background:#f0fdfa}header{background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff;padding:16px 20px;display:flex;gap:12px;align-items:center}nav{background:#ccfbf1;padding:8px 12px;display:flex;gap:8px;overflow:auto}nav button{border:none;padding:6px 14px;border-radius:20px;background:#fff;color:#0f766e;cursor:pointer}nav button.active{background:#0f766e;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.stat{background:#fff;padding:16px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}.list{background:#fff;margin:0 12px 12px;border-radius:14px;padding:14px}</style></head><body>
<header><div style="font-size:28px">💰</div><div><h2>บัญชีครอบครัว</h2><small>บันทึก รายรับ-รายจ่าย ครอบครัว</small></div></header>
<nav id="nav"></nav>
<div class="grid">
<div class="stat" style="border-left:4px solid #3b82f6"><small>เงินคงเหลือ</small><b style="display:block;font-size:22px;color:#2563eb"><span id="balance">0.00</span> บาท</b></div>
<div class="stat" style="border-left:4px solid #22c55e"><small>รายรับรวม</small><b style="display:block;font-size:22px;color:#16a34a"><span id="income">0.00</span> บาท</b></div>
<div class="stat" style="border-left:4px solid #ef4444"><small>รายจ่ายรวม</small><b style="display:block;font-size:22px;color:#dc2626"><span id="expense">0.00</span> บาท</b></div>
</div>
<div class="list"><div style="display:flex;justify-content:space-between"><h3>สรุปเดือนนี้</h3><button onclick="addEntry()" style="background:#0f766e;color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer">+ บันทึกรายการ</button></div><div id="summary" style="background:#f0fdfa;padding:10px;border-radius:10px;margin:10px 0;text-align:center">รายรับเดือนนี้ 0.00 รายจ่าย 0.00 คงเหลือ 0.00</div><div id="entries" style="text-align:center;color:#888;padding:20px">ยังไม่มีรายการ</div></div>
<script>
const TABS=["หน้าหลัก","+บันทึกรายการ","รายการทั้งหมด","รายงาน","งบประมาณ","สำรองข้อมูล"];
let entries=[];
function renderNav(){document.getElementById('nav').innerHTML=TABS.map((t,i)=>'<button class="'+(i==0?'active':'')+'" onclick="if(t==='+บันทึกรายการ')addEntry()">'+t+'</button>').join('');}
function render(){let inc=entries.filter(e=>e.type==='รับ').reduce((s,e)=>s+e.amount,0);let exp=entries.filter(e=>e.type==='จ่าย').reduce((s,e)=>s+e.amount,0);let bal=inc-exp;document.getElementById('income').textContent=inc.toFixed(2);document.getElementById('expense').textContent=exp.toFixed(2);document.getElementById('balance').textContent=bal.toFixed(2);document.getElementById('summary').textContent='รายรับเดือนนี้ '+inc.toFixed(2)+' รายจ่าย '+exp.toFixed(2)+' คงเหลือ '+bal.toFixed(2);document.getElementById('entries').innerHTML=entries.length?entries.map(e=>'<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><span>['+e.type+'] '+e.note+'</span><b style="color:'+(e.type==='รับ'?'#16a34a':'#dc2626')+'">'+(e.type==='รับ'?'+':'-')+e.amount+'฿</b></div>').join(''):'<div style="text-align:center;color:#888;padding:20px">ยังไม่มีรายการ</div>';}
function addEntry(){const type=prompt('ประเภท (รับ/จ่าย)','จ่าย');if(!['รับ','จ่าย'].includes(type))return alert('พิมพ์ รับ หรือ จ่าย');const amount=parseFloat(prompt('จำนวนเงิน'));if(!amount)return;const note=prompt('รายละเอียด','ค่ากับข้าว');entries.unshift({type,amount,note,date:new Date().toLocaleDateString('th-TH')});render();}
renderNav();render();
</script></body></html>
