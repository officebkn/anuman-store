<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material Management - P009</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet"><style>*{font-family:'Kanit',sans-serif;box-sizing:border-box;margin:0;padding:0}body{background:#f8fafc}header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}header h2{font-size:16px} .toolbar{display:flex;gap:6px} .toolbar button{border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px} nav{display:flex;gap:6px;background:#e2e8f0;padding:8px 12px;overflow:auto}nav button{border:none;padding:6px 12px;border-radius:8px;background:#fff;cursor:pointer}nav button.active{background:#3b82f6;color:#fff}.content{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.content{grid-template-columns:1fr}}.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.05)}</style></head><body>
<header><h2>📦 บริหารวัสดุ/พัสดุ ครบวงจร</h2><div class="toolbar"><button style="background:#f1f5f9">โลโก้</button><button style="background:#e2e8f0">นำเข้า Excel</button><button style="background:#22c55e;color:#fff">ส่งออก Excel</button><button style="background:#3b82f6;color:#fff">บันทึก</button><button style="background:#fee2e2">ล้างทั้งหมด</button></div></header>
<nav id="nav"></nav>
<div class="content">
<div class="card"><h3>⚠️ ต่ำกว่าเกณฑ์</h3><div id="low" style="margin-top:8px;color:#16a34a;text-align:center;padding:20px">ไม่มีต่ำกว่าเกณฑ์ - สต็อกปกติ</div></div>
<div class="card"><h3>⏰ ยืมเกินกำหนด</h3><div id="over" style="margin-top:8px;color:#16a34a;text-align:center;padding:20px">ไม่มียืมเกินกำหนด</div></div>
<div class="card" style="grid-column:1/-1"><div style="display:flex;justify-content:space-between"><h3>รายการวัสดุ</h3><button onclick="addMat()" style="background:#3b82f6;color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer">+ เพิ่มวัสดุ</button></div><div id="list" style="margin-top:10px"></div></div>
</div>
<script>
const TABS=["สต็อกคงเหลือ","คลังวัสดุ/พัสดุ","รับวัสดุ/พัสดุ","เบิกจ่าย","ยืม-คืน","แจ้งเตือน","รายงานสรุป"];
let mats=[{code:"MT-001",name:"กระดาษ A4 80แกรม",stock:50,min:10},{code:"MT-002",name:"หมึกพิมพ์ HP 85A",stock:8,min:3}];
function renderNav(){document.getElementById('nav').innerHTML=TABS.map((t,i)=>'<button class="'+(i==5?'active':'')+'">'+t+'</button>').join('');}
function render(){document.getElementById('list').innerHTML=mats.map(m=>'<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><span><b>'+m.code+'</b> '+m.name+' (คงเหลือ '+m.stock+')</span><span style="font-size:12px;color:'+(m.stock<=m.min?'#dc2626':'#16a34a')+'">'+(m.stock<=m.min?'ต่ำกว่าเกณฑ์':'ปกติ')+'</span></div>').join('');let low=mats.filter(m=>m.stock<=m.min);document.getElementById('low').innerHTML=low.length?low.map(m=>'<div>'+m.name+' เหลือ '+m.stock+' (ขั้นต่ำ '+m.min+')</div>').join(''):'ไม่มีต่ำกว่าเกณฑ์ - สต็อกปกติ';}
function addMat(){const code=prompt('รหัส');if(!code)return;const name=prompt('ชื่อวัสดุ');mats.push({code,name,stock:parseInt(prompt('จำนวน','10')||'10'),min:5});render();}
renderNav();render();
</script></body></html>
