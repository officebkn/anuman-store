<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anuman App HTML Store - 20 แอป ฟรี 100%</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
<style>body{font-family:'Kanit',sans-serif}</style>
</head>
<body class="bg-slate-50">
<header class="bg-white shadow sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
<h1 class="text-blue-600 font-bold">Anuman App HTML Store <span class="bg-green-500 text-white text-xs px-2 py-1 rounded-full ml-2">20 แอป • ฟรี 100%</span></h1>
<div class="text-xs text-gray-500" id="status">กำลังโหลด...</div>
</div>
</header>
<section class="bg-gradient-to-br from-blue-700 to-blue-500 text-white py-10 px-4 text-center">
<h2 class="text-3xl font-bold">โปรแกรม HTML สำเร็จรูป 20 แอป<br>ปลดล็อกฟรีหมดแล้ว</h2>
<p class="mt-2 text-blue-100">เพิ่มแอปใหม่แค่เพิ่มแถวใน Google Sheet เว็บอัปเดตเอง</p>
</section>
<div class="max-w-7xl mx-auto px-4 py-6">
<input id="search" placeholder="ค้นหาโปรแกรม..." class="w-full md:w-1/3 border rounded-full px-4 py-2 mb-4">
<div id="grid" class="grid md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
</div>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR8tV_ZVrsbe6xPtak-5NTpCtHaVbvOIMgtKVMEQI2WJRNioiKAwXw-eIEmNuAzGI1R5_Y9lae5HBTp/pub?output=csv";
function toDriveDownload(url){
  if(!url) return "#";
  if(url.includes("uc?export=download")) return url;
  const m = url.match(/\/d\/([^/]+)/) || url.match(/id=([^&]+)/);
  if(m) return `https://drive.google.com/uc?export=download&id=${m[1]}`;
  return url;
}

Papa.parse(CSV_URL, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results){
    const rows = results.data.filter(r=>r.id && r.id.trim()!=="");
    document.getElementById('status').innerText = `โหลดสำเร็จ ${rows.length} โปรแกรมจาก Google Sheet`;
    const grid = document.getElementById('grid');
    grid.innerHTML = rows.map(row=>{
      const id = (row.id||'').trim();
      const name = row.name||id;
      const price = row.price||'399';
      const sale = row.sale_price||'0';
      const driveRaw = row.drive_link || row.driveLink || '';
      const drive = toDriveDownload(driveRaw);
      const hasLink = driveRaw && driveRaw.length>10;
      const img = `./${id}_1.jpg`;
      const shortDesc = row.short_desc || row.description || 'โปรแกรมสำเร็จรูปพร้อมใช้งาน';
      return `
      <div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col">
        <img src="${img}" onerror="this.src='https://via.placeholder.com/400x220?text=${id}'" class="w-full h-44 object-cover">
        <div class="p-4 flex flex-col flex-1">
          <div class="text-[11px] text-blue-600 font-bold">${row.category||'SHOP'} • ${id}</div>
          <h4 class="font-bold mt-1 text-sm leading-tight line-clamp-2">${name}</h4>
          <p class="text-[11px] text-gray-500 mt-1 line-clamp-2">${shortDesc.substring(0,80)}</p>
          <div class="flex items-center gap-2 mt-3">
            <span class="line-through text-gray-400 text-xs">฿${price}</span>
            <span class="text-green-600 font-bold text-sm">${sale=='0'||sale==''?'ฟรี!':'฿'+sale}</span>
            <span class="bg-green-100 text-green-700 text-[9px] px-2 py-0.5 rounded-full ml-auto">ปลดล็อกแล้ว</span>
          </div>
          ${hasLink ? 
            `<a href="${drive}" target="_blank" class="block mt-3 bg-blue-600 hover:bg-blue-700 text-white text-center py-2.5 rounded-full font-bold text-sm">📥 ดาวน์โหลดฟรี</a>` :
            `<div class="block mt-3 bg-gray-200 text-gray-500 text-center py-2.5 rounded-full font-bold text-sm">เพิ่มลิงก์ Drive ในชีทคอลัมน์ H</div>`
          }
          <div class="text-[10px] text-center text-gray-400 mt-2">ไฟล์ HTML • เปิดใน Chrome</div>
        </div>
      </div>`;
    }).join('');

    document.getElementById('search').addEventListener('input', e=>{
      const q = e.target.value.toLowerCase();
      const filtered = rows.filter(r=> (r.name||'').toLowerCase().includes(q) || (r.id||'').toLowerCase().includes(q));
      document.getElementById('status').innerText = `พบ ${filtered.length} โปรแกรม`;
      if(q==='') location.reload();
      else {
        grid.innerHTML = filtered.map(row=>{
          const id=row.id||''; const name=row.name||''; const drive=toDriveDownload(row.drive_link||'');
          return `<div class="bg-white rounded-xl p-4 shadow"><h4 class="font-bold">${name}</h4><a href="${drive}" class="block mt-2 bg-blue-600 text-white text-center py-2 rounded-full">โหลด ${id}</a></div>`;
        }).join('');
      }
    });
  },
  error: function(err){
    document.getElementById('status').innerText = 'โหลดชีทไม่ได้: ' + err.message + ' - ตรวจสอบ Publish เป็น CSV แล้ว';
  }
});
</script>
</body>
</html>
