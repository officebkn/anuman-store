<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20+ โปรแกรม โหลดฟรี - Anuman Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="bg-gradient-to-b from-blue-50/80 to-white pt-12 pb-8 px-4 border-b border-slate-100">
        <div class="max-w-6xl mx-auto text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-3">20+ โปรแกรม โหลดฟรี</h1>
            <p class="text-slate-600 max-w-2xl mx-auto text-sm md:text-base mb-6">
                รวมไฟล์เดี่ยวเปิดใช้งานได้ทันที ไม่ต้องติดตั้ง เหมาะสำหรับร้านค้า ชุมชน หอพัก อู่ซ่อมรถ ร้านยา และระบบคิว
            </p>
            
            <!-- Badge Info -->
            <div class="flex flex-wrap justify-center gap-3 mb-8">
                <span class="bg-slate-100 text-slate-700 text-xs font-medium px-3 py-1.5 rounded-full">📦 20 รายการ</span>
                <span class="bg-blue-600 text-white text-xs font-medium px-3 py-1.5 rounded-full">🚀 3 ปุ่ม คิวครบวงจร</span>
                <span class="bg-slate-100 text-slate-700 text-xs font-medium px-3 py-1.5 rounded-full">🔗 ซิงค์จาก GitHub API</span>
            </div>

            <!-- Search Bar -->
            <div class="max-w-xl mx-auto relative">
                <input type="text" id="searchInput" placeholder="ค้นหา P001, ร้านขายยา, หอพัก, คิว..." 
                    class="w-full px-5 py-3.5 pl-12 rounded-full border border-slate-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                <svg class="w-5 h-5 text-slate-400 absolute left-4 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            <p class="text-xs text-slate-400 mt-2">กด Enter เพื่อค้นหา • พิมพ์ชื่อโปรแกรมหรือเลข P เช่น P013</p>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-6xl mx-auto px-4 py-10 flex-grow w-full">
        <div id="programGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- ข้อมูลจะถูกเรนเดอร์ลงส่วนนี้ -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        <p>&copy; Anuman Store - ดาวน์โหลดใช้งานง่าย พร้อมคู่มือ PDF</p>
    </footer>

    <!-- Script เชื่อมโยงไฟล์ HTML และคู่มือจาก GitHub อัตโนมัติ -->
    <script>
        const githubUser = "officebkn";
        const repoName = "anuman-store";
        
        const programs = [
            { id: "P001", name: "โปรแกรมร้านขายยา AB ฟาร์มาซี สำเร็จรูป พร้อมใช้งาน", desc: "ระบบจัดการร้านขายยา ตรวจสอบวันหมดอายุ และบันทึกการขาย" },
            { id: "P002", name: "ระบบจัดการร้านเช่ารถ มอเตอร์ไซค์ & EV สำเร็จรูป", desc: "บันทึกข้อมูลผู้เช่า ตารางคืนรถ และสถานะแบตเตอรี่รถ EV" },
            { id: "P003", name: "ระบบร้านอะไหล่ยนต์ ระบบบริหารจัดการร้าน สำเร็จรูป", desc: "คลังอะไหล่ เช็คสต็อก และออกใบเสนอราคา" },
            { id: "P004", name: "ระบบจัดการหอพัก 50 ห้อง สำเร็จรูป", desc: "คำนวณค่าน้ำ ค่าไฟ และออกบิลรายเดือน" },
            { id: "P005", name: "ระบบจองห้องประชุม และอุปกรณ์ส่วนกลาง", desc: "เช็คเวลาว่าง จองห้องประชุม และอุปกรณ์ไอที" },
            { id: "P006", name: "ระบบบัญชีครัวเรือน รายรับ-รายจ่าย", desc: "สรุปผลการเงินรายเดือน กราฟเข้าใจง่าย" },
            { id: "P007", name: "ระบบเรียกคิวอัจฉริยะ (Queue System)", desc: "3 โหมด: หน้าจอแสดงผล, เคาน์เตอร์ และตู้กดบัตร" },
            { id: "P008", name: "ระบบจัดการร้านกาแฟ / คาเฟ่ POS", desc: "รับออเดอร์หน้าร้าน เพิ่มท็อปปิ้ง คำนวณเงิน" },
            { id: "P009", name: "ระบบเช่าชุดราตรี และห้องเสื้อ", desc: "บันทึกวันรับ-วันคืนชุด และสถานะมัดจำ" },
            { id: "P010", name: "ระบบจัดตารางเวรเจ้าหน้าที่", desc: "จัดเวรผลัด บ่าย ดึก เช้า คำนวณค่าตอบแทน" },
            { id: "P011", name: "ระบบประเมินความพึงพอใจลูกค้า", desc: "ฟอร์มให้คะแนน สถิติคะแนนรายวัน" },
            { id: "P012", name: "ระบบบันทึกเวลาทำงานพนักงาน (Check-in)", desc: "เช็คชื่อเข้า-ออกงานผ่านเว็บเบราว์เซอร์" },
            { id: "P013", name: "ระบบคลินิกชุมชน เวชภัณฑ์และผู้ป่วย", desc: "บันทึกประวัติคนไข้และการจ่ายยาเบื้องต้น" },
            { id: "P014", name: "ระบบจองคิวร้านตัดผมชาย-หญิง", desc: "เลือกช่าง จองเวลาล็อกคิวสะดวกรวดเร็ว" },
            { id: "P015", name: "ระบบแจ้งซ่อมบำรุงอาคาร (Helpdesk)", desc: "แจ้งซ่อมแอร์ ไฟฟ้าประปา ติดตามสถานะงาน" },
            { id: "P016", name: "ระบบจัดการสต็อกวัตถุดิบอาหารสด", desc: "เตือนของใกล้หมดอายุ สรุปยอดซื้อรายสัปดาห์" },
            { id: "P017", name: "ระบบคำนวณต้นทุนการผลิตสินค้า", desc: "รวมค่าวัตถุดิบ ค่าแรง ตั้งราคาขายส่ง-ปลีก" },
            { id: "P018", name: "ระบบสมุดพฤติกรรมนักเรียน", desc: "บันทึกคะแนนความประพฤติ ผลการเรียน" },
            { id: "P019", name: "ระบบประเมินราคาโรงพิมพ์ย่อย", desc: "คำนวณขนาดกระดาษ จำนวนพิมพ์ ราคาเบื้องต้น" },
            { id: "P020", name: "ระบบบริจาคและอาสาสมัครชุมชน", desc: "บันทึกรายชื่อผู้บริจาค และลงทะเบียนอาสาสมัคร" }
        ];

        function renderPrograms(filterText = "") {
            const grid = document.getElementById('programGrid');
            grid.innerHTML = "";

            const filtered = programs.filter(p => 
                p.name.toLowerCase().includes(filterText.toLowerCase()) || 
                p.desc.toLowerCase().includes(filterText.toLowerCase()) ||
                p.id.toLowerCase().includes(filterText.toLowerCase())
            );

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">ไม่พบโปรแกรมที่คุณค้นหา</div>`;
                return;
            }

            filtered.forEach(p => {
                // ลิงก์รูปภาพจาก GitHub
                const imageUrl = `https://${githubUser}.github.io/${repoName}/${p.id}_1.jpg`;
                // ลิงก์ดาวน์โหลดไฟล์ HTML ของโปรแกรม
                const downloadAppUrl = `https://${githubUser}.github.io/${repoName}/${p.id}.html`;
                // ลิงก์ดาวน์โหลดคู่มือ PDF (เมื่อคุณสร้างโฟลเดอร์ manuals ตามที่คุยกัน)
                const manualUrl = `https://${githubUser}.github.io/${repoName}/manuals/${p.id}.pdf`;

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition-shadow";
                
                card.innerHTML = `
                    <div>
                        <div class="relative h-48 overflow-hidden bg-slate-100">
                            <img src="${imageUrl}" alt="${p.name}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400x250?text=${p.id}'">
                            <span class="absolute top-3 left-3 bg-slate-900/70 backdrop-blur-md text-white text-xs font-semibold px-2.5 py-1 rounded-md">
                                ${p.id}
                            </span>
                        </div>
                        <div class="p-5">
                            <h3 class="font-bold text-slate-800 text-base mb-1 line-clamp-1">${p.name}</h3>
                            <p class="text-xs text-slate-500 line-clamp-2 mb-4">${p.desc}</p>
                        </div>
                    </div>
                    <div class="px-5 pb-5 pt-0 flex items-center gap-2">
                        <!-- ปุ่มดาวน์โหลดตัวโปรแกรม HTML -->
                        <a href="${downloadAppUrl}" download class="flex-1 text-center bg-blue-600 hover:bg-blue-700 text-white py-2 px-3 rounded-xl text-xs font-medium transition-colors flex items-center justify-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            ดาวน์โหลดโปรแกรม
                        </a>
                        <!-- ปุ่มดาวน์โหลดคู่มือ PDF -->
                        <a href="${manualUrl}" target="_blank" download title="ดาวน์โหลดคู่มือ" class="bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            คู่มือ
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderPrograms(e.target.value);
        });

        renderPrograms();
    </script>
</body>
</html>
