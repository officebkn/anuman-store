<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AB Pharmacy - P001</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet"><style>*{font-family:'Kanit',sans-serif;box-sizing:border-box;margin:0;padding:0}body{background:#f1f8f3;color:#0f172a}header{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}header h1{font-size:20px;font-weight:600}nav{display:flex;gap:6px;background:#dcfce7;padding:8px 12px;overflow:auto}nav button{border:none;padding:7px 14px;border-radius:999px;background:#fff;color:#166534;font-size:13px;cursor:pointer;white-space:nowrap}nav button.active{background:#16a34a;color:#fff}main{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:12px;height:calc(100vh - 98px)}@media(max-width:900px){main{grid-template-columns:1fr}} .card{background:#fff;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.06);padding:12px} .search{width:100%;padding:10px 14px;border:1px solid #bbf7d0;border-radius:10px;outline:none} .drug{border-bottom:1px solid #f0fdf4;padding:10px 0;display:flex;justify-content:space-between;align-items:center} .drug b{font-size:14px} .tag{font-size:11px;background:#dcfce7;color:#166534;padding:2px 6px;border-radius:6px} button.add{background:#16a34a;color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer} .cart-item{display:flex;justify-content:space-between;margin:6px 0;font-size:14px} .total{font-weight:600;font-size:18px;text-align:right;margin-top:10px;border-top:2px solid #16a34a;padding-top:8px}</style></head><body>
<header><h1>💊 AB Pharmacy - ร้านขายยา</h1><span style="background:#fff;color:#16a34a;padding:4px 10px;border-radius:20px;font-size:12px">POS • สาขา 01</span></header>
<nav id="tabs"></nav>
<main>
<div class="card"><input id="search" class="search" placeholder="ค้นหาชื่อยา - พิมพ์ชื่อ ยี่ห้อ หรืออาการ"><div id="list" style="margin-top:10px"></div></div>
<div class="card"><h3 style="margin-bottom:8px">🛒 ตะกร้า ( <span id="cartCount">0</span> )</h3><div id="cart"></div><div style="margin-top:8px"><label><input type="checkbox" id="vat" checked> VAT 7%</label></div><div class="total">รวม: <span id="total">0.00</span> THB</div><button onclick="checkout()" style="width:100%;margin-top:10px;background:#16a34a;color:#fff;border:none;padding:10px;border-radius:10px;cursor:pointer">ชำระเงิน - พิมพ์ใบเสร็จ</button><button onclick="clearCart()" style="width:100%;margin-top:6px;background:#f3f4f6;border:none;padding:8px;border-radius:10px;cursor:pointer">ล้างตะกร้า</button></div>
</main>
<script>
const TABS=["ขายหน้าร้าน(POS)","คลังสินค้า","รับเข้า","คนไข้/แพทย์","รายงานประวัติ","ตั้งค่าร้าน","สำรองข้อมูล"];
const DRUGS=[
{id:"D001",name:"Paracetamol 500mg",price:45,stock:120,cat:"ยาสามัญ"},
{id:"D002",name:"Amoxicillin 500mg",price:120,stock:45,cat:"ยาปฏิชีวนะ"},
{id:"D003",name:"Omeprazole 20mg",price:85,stock:60,cat:"ทางเดินอาหาร"},
{id:"D004",name:"Cetirizine 10mg",price:35,stock:90,cat:"แก้แพ้"},
{id:"D005",name:"Vitamin C 1000mg",price:199,stock:30,cat:"วิตามิน"},
{id:"D006",name:"Mask 3 ชั้น 50ชิ้น",price:89,stock:200,cat:"เวชภัณฑ์"}
];
let cart=[];
function renderTabs(){const el=document.getElementById('tabs');el.innerHTML=TABS.map((t,i)=>'<button class="'+(i==0?'active':'')+'" onclick="switchTab(this)">'+t+'</button>').join('');}
function switchTab(btn){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function renderList(f=''){const list=document.getElementById('list');const filtered=DRUGS.filter(d=>d.name.toLowerCase().includes(f.toLowerCase()));list.innerHTML=filtered.map(d=>'<div class=drug><div><b>'+d.name+'</b><div style="font-size:12px;color:#666">คงเหลือ '+d.stock+' • <span class=tag>'+d.cat+'</span></div></div><div style="text-align:right"><div>'+d.price+'฿</div><button class=add onclick="addToCart(\''+d.id+'\')">+ เพิ่ม</button></div></div>').join('')||'<div style="padding:20px;text-align:center;color:#888">ไม่พบรายการ</div>';}
function addToCart(id){const item=DRUGS.find(d=>d.id===id);const c=cart.find(x=>x.id===id);if(c)c.qty++;else cart.push({...item,qty:1});renderCart();}
function renderCart(){document.getElementById('cartCount').textContent=cart.reduce((s,i)=>s+i.qty,0);document.getElementById('cart').innerHTML=cart.map(i=>'<div class=cart-item><span>'+i.name+' x'+i.qty+'</span><span>'+(i.price*i.qty)+'฿ <button onclick="removeItem(\''+i.id+'\')" style="border:none;background:#fee2e2;color:#dc2626;border-radius:4px;padding:2px 6px">x</button></span></div>').join('')||'<div style="color:#999;font-size:13px">ตะกร้าว่าง</div>';calc();}
function removeItem(id){cart=cart.filter(c=>c.id!==id);renderCart();}
function calc(){let sum=cart.reduce((s,i)=>s+i.price*i.qty,0);if(document.getElementById('vat').checked)sum=sum*1.07;document.getElementById('total').textContent=sum.toFixed(2);}
function clearCart(){cart=[];renderCart();}
function checkout(){if(!cart.length)return alert('ตะกร้าว่าง');alert('ชำระเงินสำเร็จ ยอด '+document.getElementById('total').textContent+' THB');clearCart();}
document.getElementById('search').addEventListener('input',e=>renderList(e.target.value));
document.getElementById('vat').addEventListener('change',calc);
renderTabs();renderList();renderCart();
</script></body></html>
