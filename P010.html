<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Card - P010</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet"><style>*{font-family:'Kanit',sans-serif;box-sizing:border-box;margin:0;padding:0}body{background:#eff6ff}header{background:#1d4ed8;color:#fff;padding:14px 20px;display:flex;justify-content:space-between}nav{display:flex;gap:6px;background:#dbeafe;padding:8px 12px;overflow:auto}nav button{border:none;padding:6px 12px;border-radius:8px;background:#fff;color:#1d4ed8;cursor:pointer}nav button.active{background:#2563eb;color:#fff}.panel{padding:12px;display:grid;grid-template-columns:300px 1fr;gap:12px}@media(max-width:800px){.panel{grid-template-columns:1fr}}.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}input,select,textarea{width:100%;padding:8px;border:1px solid #bfdbfe;border-radius:8px;margin:6px 0}button.action{border:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:#fff}</style></head><body>
<header><h2>📋 Stock Card พัสดุ</h2><span>16/10/2026</span></header>
<nav id="nav"></nav>
<div class="panel">
<div class="card"><h3>บันทึกรับ-จ่าย</h3><label>รหัสสินค้า<input id="code" placeholder="เช่น IT-001"></label><label>ชื่อสินค้า<input id="name" placeholder="ชื่อพัสดุ"></label><label>จำนวน<input id="qty" type="number" value="1"></label><label>หมายเหตุ<textarea id="note" placeholder="หมายเหตุ"></textarea></label><div style="display:flex;gap:8px;margin-top:8px"><button class="action" style="background:#22c55e;flex:1" onclick="inStock()">+รับเข้า</button><button class="action" style="background:#ef4444;flex:1" onclick="outStock()">-จ่ายออก</button></div><button onclick="save()" style="width:100%;margin-top:8px;background:#2563eb;color:#fff;border:none;padding:10px;border-radius:8px;cursor:pointer">บันทึกการเคลื่อนไหว</button></div>
<div class="card"><h3>เคลื่อนไหวรายวัน - ภาพรวมทั้งหมด</h3><div id="list" style="margin-top:10px"></div><div style="margin-top:12px;display:flex;gap:12px"><div style="background:#eff6ff;padding:10px;border-radius:8px;flex:1;text-align:center">รับเข้าทั้งหมด<br><b id="totalIn">0</b></div><div style="background:#fef2f2;padding:10px;border-radius:8px;flex:1;text-align:center">จ่ายออก<br><b id="totalOut">0</b></div><div style="background:#f0fdf4;padding:10px;border-radius:8px;flex:1;text-align:center">คงเหลือ<br><b id="balance">0</b></div></div></div>
</div>
<script>
const TABS=["บันทึกรับ-จ่าย","Stock Card","เคลื่อนไหวรายวัน","ภาพรวมทั้งหมด","จัดการสินค้า"];
let moves=[];
function renderNav(){document.getElementById('nav').innerHTML=TABS.map((t,i)=>'<button class="'+(i==0?'active':'')+'">'+t+'</button>').join('');}
function render(){document.getElementById('list').innerHTML=moves.length?moves.map(m=>'<div style="display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #eee;font-size:13px"><span>['+m.type+'] '+m.code+' '+m.name+' x'+m.qty+'</span><span style="font-size:11px;color:#666">'+m.date+' • '+m.note+'</span></div>').join(''):'<div style="text-align:center;color:#888;padding:20px">ยังไม่มีรายการ</div>';let ti=moves.filter(m=>m.type==='รับ').reduce((s,m)=>s+m.qty,0);let to=moves.filter(m=>m.type==='จ่าย').reduce((s,m)=>s+m.qty,0);document.getElementById('totalIn').textContent=ti;document.getElementById('totalOut').textContent=to;document.getElementById('balance').textContent=ti-to;}
function save(){const code=document.getElementById('code').value;const name=document.getElementById('name').value;const qty=parseInt(document.getElementById('qty').value||'0');const note=document.getElementById('note').value;if(!code||!qty)return alert('กรอกรหัสและจำนวน');moves.unshift({code,name,qty,type:'รับ',note,date:new Date().toLocaleString('th-TH')});render();}
function inStock(){const code=document.getElementById('code').value;const name=document.getElementById('name').value;const qty=parseInt(document.getElementById('qty').value||'0');const note=document.getElementById('note').value;if(!code||!qty)return alert('กรอกข้อมูล');moves.unshift({code,name,qty,type:'รับ',note,date:new Date().toLocaleString('th-TH')});render();}
function outStock(){const code=document.getElementById('code').value;const name=document.getElementById('name').value;const qty=parseInt(document.getElementById('qty').value||'0');const note=document.getElementById('note').value;if(!code||!qty)return alert('กรอกข้อมูล');moves.unshift({code,name,qty,type:'จ่าย',note,date:new Date().toLocaleString('th-TH')});render();}
renderNav();render();
</script></body></html>
