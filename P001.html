<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy POS - Key Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-emerald-900 via-slate-900 to-teal-900 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 space-y-6">
        <div class="text-center">
            <div class="text-4xl mb-2">🔑</div>
            <h1 class="text-xl font-bold text-emerald-800">ระบบสร้าง License Key</h1>
            <p class="text-xs text-gray-500 mt-1">สำหรับโปรแกรมจัดการร้านขายยา (Pharmacy POS)</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">กรอกรหัสเครื่อง (Device ID จากหน้าจอโปรแกรม)</label>
                <input type="text" id="dev-id" placeholder="เช่น M12345678" class="w-full border-2 border-gray-200 focus:border-emerald-500 rounded-xl px-4 py-3 font-mono text-center uppercase tracking-wider text-sm outline-none transition">
            </div>

            <button onclick="generateKey()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-600/30">
                🚀 สร้าง License Key
            </button>

            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">License Key ที่ได้:</label>
                <input type="text" id="res-key" readonly placeholder="PH-XXXX-XXXX-XXXX-X" class="w-full bg-gray-50 border-2 border-emerald-300 rounded-xl px-4 py-3 font-mono text-center uppercase tracking-wider text-sm text-emerald-700 font-bold select-all">
            </div>

            <button onclick="copyKey()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-2">
                📋 คัดลอก License Key
            </button>
        </div>
        
        <p class="text-[11px] text-center text-gray-400">1 รหัสเครื่อง จะได้คีย์เฉพาะสำหรับเครื่องนั้นเท่านั้น</p>
    </div>

    <script>
        const PRODUCT_PREFIX = "PH";
        const SECRET_KEY_VAL = 42;
        const CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        function charToVal(c) {
            return c >= '0' && c <= '9' ? c.charCodeAt(0) - 48 : c.charCodeAt(0) - 55;
        }

        function generateKey() {
            let mid = document.getElementById('dev-id').value.trim().toUpperCase();
            if(!mid) {
                alert('กรุณากรอกรหัสเครื่อง (Device ID)');
                return;
            }

            // แปลงรหัสเครื่องให้เป็นรูปแบบ 12 ตัวอักษรมาตรฐานสำหรับทำ Checksum
            let cleanMid = mid.replace(/[^0-9A-Z]/g, '');
            let body = (cleanMid + "PHARMACYPOSKEY").slice(0, 12);

            let sum = SECRET_KEY_VAL;
            for (let i = 0; i < body.length; i++) {
                sum += charToVal(body[i]);
            }
            let checkChar = CHARS[sum % 36];
            let fullClean = body + checkChar;

            // จัดรูปแบบให้สวยงามอ่านง่าย (PH-XXXX-XXXX-XXXX-X)
            let formatted = `${PRODUCT_PREFIX}-${fullClean.slice(0,4)}-${fullClean.slice(4,8)}-${fullClean.slice(8,12)}-${fullClean.slice(12)}`;
            
            document.getElementById('res-key').value = formatted;
        }

        function copyKey() {
            const resField = document.getElementById('res-key');
            if(!resField.value) {
                alert('ยังไม่มีคีย์สำหรับคัดลอก กรุณากดสร้างคีย์ก่อน');
                return;
            }
            resField.select();
            navigator.clipboard.writeText(resField.value);
            alert('คัดลอก License Key เรียบร้อยแล้ว!');
        }
    </script>
</body>
</html>
