<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AB ฟาร์มาซี - ระบบร้านขายยา POS</title><script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>body{font-family:'Kanit',sans-serif} .active{background:#16a34a;color:white}</style></head>
<body class="bg-gray-50 min-h-screen">
<header class="bg-green-600 text-white p-4 flex justify-between items-center"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-green-600 font-bold">AB</div><div><h1 class="font-semibold">AB ฟาร์มาซี</h1><p class="text-xs opacity-80">ระบบบริหารร้านขายยา POS v2.0</p></div></div><div class="text-right text-sm"><p id="clock"></p><p class="text-xs">สาขา: สำนักงานใหญ่</p></div></header>
<nav id="tabs" class="bg-white shadow p-2 flex gap-2 overflow-x-auto"></nav>
<div class="flex flex-col lg:flex-row gap-4 p-4 max-w-[1600px] mx-auto">
<div class="flex-1"><div class="bg-white rounded-xl shadow p-4"><div class="flex gap-2 mb-4"><input id="search" placeholder="ค้นหาชื่อยา, รหัส, บาร์โค้ด..." class="flex-1 border rounded-lg px-4 py-2"><select id="catFilter" class="border rounded-lg px-3 py-2"><option value="">ทุกหมวด</option><option>ยาสามัญ</option><option>ยาปฏิชีวนะ</option><option>ยาหลังอาหาร</option><option>แก้แพ้</option><option>วิตามิน</option><option>เวชภัณฑ์</option></select></div><div id="list" class="grid md:grid-cols-2 gap-3 max-h-[70vh] overflow-y-auto"></div></div></div>
<div class="w-full lg:w-[380px]"><div class="bg-white rounded-xl shadow p-4 sticky top-4"><h3 class="font-semibold mb-3">ตะกร้าขาย <span id="cartCount" class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full text-xs">0 รายการ</span></h3><div id="cart" class="space-y-2 min-h-[120px] text-sm text-gray-400 flex items-center justify-center">ยังไม่มีสินค้า</div><div class="border-t mt-4 pt-4 space-y-2 text-sm"><div class="flex justify-between"><span>ยอดรวม</span><span id="subtotal">0.00 ฿</span></div><label class="flex items-center gap-2"><input type="checkbox" id="vat" checked> VAT 7%</label><div class="flex justify-between font-bold text-lg"><span>สุทธิ</span><span id="total" class="text-green-600">0.00 ฿</span></div><div class="grid grid-cols-2 gap-2 mt-3"><button onclick="clearCart()" class="border rounded-lg py-2">ล้างตะกร้า</button><button onclick="checkout()" class="bg-green-600 text-white rounded-lg py-2 font-medium">ชำระเงิน</button></div><button onclick="exportExcel()" class="w-full mt-2 bg-blue-50 text-blue-600 rounded-lg py-2 text-sm">📊 ส่งออก Excel</button></div><div class="mt-4 p-3 bg-yellow-50 rounded-lg text-xs"><p class="font-medium">คนไข้/แพทย์</p><input id="patient" placeholder="ชื่อคนไข้ (ถ้ามี)" class="w-full mt-1 border rounded px-2 py-1"><input id="doctor" placeholder="แพทย์ผู้สั่ง (ถ้ามี)" class="w-full mt-2 border rounded px-2 py-1"></div></div></div>
</div>
<script>
const TABS=["ขายหน้าร้าน(POS)","คลังสินค้า","รับเข้า","คนไข้/แพทย์","รายงานประวัติ","ตั้งค่าร้าน","สำรองข้อมูล"];
const DRUGS=[
{id:"D001",name:"Paracetamol 500mg",price:45,stock:120,cat:"ยาสามัญ",barcode:"8850001",dosage:"500mg x 10 เม็ด"},
{id:"D002",name:"Amoxicillin 500mg",price:120,stock:45,cat:"ยาปฏิชีวนะ",barcode:"8850002",dosage:"500mg x 10 แคปซูล"},
{id:"D003",name:"Omeprazole 20mg",price:85,stock:60,cat:"ยาหลังอาหาร",barcode:"8850003",dosage:"20mg x 14 แคปซูล"},
{id:"D004",name:"Cetirizine 10mg",price:35,stock:90,cat:"แก้แพ้",barcode:"8850004",dosage:"10mg x 10 เม็ด"},
{id:"D005",name:"Vitamin C 1000mg",price:199,stock:30,cat:"วิตามิน",barcode:"8850005",dosage:"1000mg x 30 เม็ด"},
{id:"D006",name:"Mask 3 ชั้น 50ชิ้น",price:89,stock:200,cat:"เวชภัณฑ์",barcode:"8850006",dosage:"50 ชิ้น/กล่อง"},
{id:"D007",name:"Ibuprofen 400mg",price:55,stock:80,cat:"ยาสามัญ",barcode:"8850007",dosage:"400mg x 10 เม็ด"},
{id:"D008",name:"Loratadine 10mg",price:40,stock:70,cat:"แก้แพ้",barcode:"8850008",dosage:"10mg x 10 เม็ด"},
{id:"D009",name:"ORS ผงเกลือแร่",price:15,stock:150,cat:"ยาสามัญ",barcode:"8850009",dosage:"1 ซอง"},
{id:"D010",name:"Betadine 15ml",price:65,stock:50,cat:"เวชภัณฑ์",barcode:"8850010",dosage:"15ml"},
{id:"D011",name:"Fexofenadine 120mg",price:75,stock:35,cat:"แก้แพ้",barcode:"8850011",dosage:"120mg x 10 เม็ด"},
{id:"D012",name:"Vitamin D3 1000IU",price:250,stock:25,cat:"วิตามิน",barcode:"8850012",dosage:"1000IU x 30 เม็ด"},
];
let cart=JSON.parse(localStorage.getItem('pharmacy_cart')||'[]');
let sales=JSON.parse(localStorage.getItem('pharmacy_sales')||'[]');
function renderTabs(){const el=document.getElementById('tabs');el.innerHTML=TABS.map((t,i)=>`<button onclick="switchTab(${i})" class="px-4 py-2 rounded-full text-sm whitespace-nowrap ${i==0?'active bg-green-600 text-white':''}">${t}</button>`).join('');}
function switchTab(i){document.querySelectorAll('#tabs button').forEach((b,idx)=>{b.classList.toggle('active',idx==i); b.classList.toggle('bg-green-600',idx==i); b.classList.toggle('text-white',idx==i);}); if(i!=0) alert('แท็บ '+TABS[i]+' - ตัวเต็มมีระบบครบ: คลัง รับเข้า รายงาน สำรองข้อมูล');}
function renderList(f=""){const cat=document.getElementById('catFilter').value; const list=document.getElementById('list'); let filtered=DRUGS.filter(d=>d.name.toLowerCase().includes(f.toLowerCase())||d.id.toLowerCase().includes(f.toLowerCase())); if(cat) filtered=filtered.filter(d=>d.cat==cat); list.innerHTML=filtered.map(d=>`<div class="border rounded-xl p-3 flex justify-between items-center hover:shadow"><div><p class="font-medium text-sm">${d.id} ${d.name}</p><p class="text-xs text-gray-500">${d.dosage} | คงเหลือ ${d.stock} | ${d.cat} | ${d.barcode}</p><p class="text-green-600 font-semibold">${d.price} ฿</p></div><button onclick="addToCart('${d.id}')" class="bg-green-600 text-white px-3 py-1 rounded-full text-xs">+ เพิ่ม</button></div>`).join('');}
function addToCart(id){const item=DRUGS.find(d=>d.id==id); const c=cart.find(x=>x.id==id); if(c) c.qty++; else cart.push({...item,qty:1}); save(); renderCart();}
function renderCart(){const el=document.getElementById('cart'); if(cart.length==0){el.innerHTML='<div class="text-gray-400 py-8">ยังไม่มีสินค้า</div>';}else{el.innerHTML=cart.map((it,i)=>`<div class="flex justify-between items-center border-b py-2"><div class="flex-1"><p class="font-medium">${it.name}</p><p class="text-xs text-gray-500">${it.price} x ${it.qty}</p></div><div class="flex items-center gap-2"><button onclick="changeQty(${i},-1)" class="w-6 h-6 border rounded">-</button><span>${it.qty}</span><button onclick="changeQty(${i},1)" class="w-6 h-6 border rounded">+</button><button onclick="removeItem(${i})" class="text-red-500 ml-2">×</button></div></div>`).join('');} calc(); document.getElementById('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0)+' รายการ';}
function changeQty(i,d){cart[i].qty+=d; if(cart[i].qty<=0) cart.splice(i,1); save(); renderCart();}
function removeItem(i){cart.splice(i,1); save(); renderCart();}
function calc(){let sum=cart.reduce((s,x)=>s+x.price*x.qty,0); document.getElementById('subtotal').textContent=sum.toFixed(2)+' ฿'; if(document.getElementById('vat').checked) sum*=1.07; document.getElementById('total').textContent=sum.toFixed(2)+' ฿';}
function save(){localStorage.setItem('pharmacy_cart',JSON.stringify(cart));}
function clearCart(){cart=[]; save(); renderCart();}
function checkout(){if(cart.length==0) return alert('ตะกร้าว่าง'); const total=document.getElementById('total').textContent; const patient=document.getElementById('patient').value; const doctor=document.getElementById('doctor').value; sales.push({date:new Date().toISOString(),items:[...cart],total,patient,doctor}); localStorage.setItem('pharmacy_sales',JSON.stringify(sales)); alert('ชำระเงินสำเร็จ ยอด '+total); clearCart();}
function exportExcel(){let csv='รหัส,ชื่อยา,จำนวน,ราคา,รวม\n'+cart.map(c=>`${c.id},${c.name},${c.qty},${c.price},${c.price*c.qty}`).join('\n'); const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pharmacy_sale.csv'; a.click();}
document.getElementById('search').addEventListener('input',e=>renderList(e.target.value));
document.getElementById('catFilter').addEventListener('change',()=>renderList(document.getElementById('search').value));
document.getElementById('vat').addEventListener('change',calc);
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleString('th-TH');},1000);
renderTabs(); renderList(); renderCart();
</script></body></html>
