<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบจัดการอู่ซ่อมรถ</title>
<style>
*{box-sizing:border-box;font-family:"Segoe UI",Tahoma,sans-serif}
body{margin:0;background:#eef1f5;color:#1f2733}
header{background:#10243e;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .sp{flex:1}
nav{background:#1b3a63;display:flex;flex-wrap:wrap}
nav button{background:none;border:0;color:#cfe0f5;padding:12px 18px;cursor:pointer;font-size:14px}
nav button:hover{background:#27507f}
nav button.on{background:#eef1f5;color:#10243e;font-weight:700}
main{padding:18px;max-width:1250px;margin:auto}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px #0001}
.card h2{margin:0 0 12px;font-size:16px;color:#10243e;border-left:4px solid #e8911a;padding-left:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid #e3e8ef;text-align:left}
th{background:#f5f7fa;font-size:12px;color:#5a6b80}
tr:hover td{background:#fafcff}
input,select,textarea{padding:7px 9px;border:1px solid #c9d3e0;border-radius:6px;font-size:13px;width:100%;background:#fff}
label{font-size:12px;color:#5a6b80;display:block;margin-bottom:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.col{flex:1;min-width:150px}
button.b{background:#1b6ec2;color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px}
button.b:hover{opacity:.9}
button.g{background:#1e9e5a}button.r{background:#c0392b}button.o{background:#e8911a}button.s{background:#6b7b90}
.pill{padding:2px 9px;border-radius:20px;font-size:11px;color:#fff;white-space:nowrap;display:inline-block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.kpi{display:flex;gap:14px;flex-wrap:wrap}
.kpi div{flex:1;min-width:150px;background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px #0001;border-top:4px solid #1b6ec2}
.kpi b{display:block;font-size:24px;margin-top:4px;color:#10243e}
.warn{border-top-color:#c0392b!important}
.ok{border-top-color:#1e9e5a!important}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:50}
.modal.on{display:flex}
.box{background:#fff;border-radius:10px;padding:18px;width:100%;max-width:920px}
.box h3{margin:0 0 14px;color:#10243e}
.alert{background:#fff3cd;border-left:4px solid #e8911a;padding:10px;border-radius:6px;font-size:13px;margin-bottom:10px}
.danger{background:#fdecea;border-left-color:#c0392b}
.info{background:#e8f1fb;border-left-color:#1b6ec2}
/* รูปถ่าย */
.gal{display:flex;flex-wrap:wrap;gap:10px}
.ph{width:150px;border:1px solid #d8e0ea;border-radius:8px;overflow:hidden;background:#fff}
.ph img{width:100%;height:105px;object-fit:cover;display:block;cursor:pointer}
.ph .m{padding:5px}
.ph select,.ph input{font-size:11px;padding:3px 5px;margin-bottom:3px}
.drop{border:2px dashed #9fb4cc;border-radius:10px;padding:18px;text-align:center;color:#5a6b80;font-size:13px;background:#f8fbff;cursor:pointer}
.drop.hot{background:#e3f0ff;border-color:#1b6ec2}
/* ปฏิทินนัด */
.wk{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.wk div{flex:1;min-width:92px;background:#fff;border:1px solid #dde4ed;border-radius:8px;padding:8px;text-align:center;cursor:pointer;font-size:12px}
.wk div.sel{background:#10243e;color:#fff;border-color:#10243e}
.wk div b{display:block;font-size:18px;margin-top:3px}
.wk div.hol{background:#fff6f6}
.slot{border-left:4px solid #1b6ec2;background:#f8fbff;padding:10px;border-radius:6px;margin-bottom:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.slot .t{font-size:19px;font-weight:700;color:#10243e;min-width:70px}
.slot .sp{flex:1}
/* เอกสารพิมพ์ */
#doc{display:none}
#doc .paper{background:#fff;padding:30px;max-width:800px;margin:auto;font-size:13px}
#doc table{font-size:12px}
#doc th,#doc td{border:1px solid #999}
.dhead{display:flex;justify-content:space-between;border-bottom:2px solid #10243e;padding-bottom:10px;margin-bottom:14px}
.dtitle{font-size:20px;font-weight:700;text-align:right}
.sum td{border:0!important;padding:3px 6px}
.pgal{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pgal figure{margin:0;width:31%}
.pgal img{width:100%;border:1px solid #999}
.pgal figcaption{font-size:10px;text-align:center}
@media print{
 body{background:#fff}
 header,nav,main,.modal{display:none!important}
 #doc{display:block!important}
 #doc .noprint{display:none}
 .pgal{page-break-inside:avoid}
}
</style>
</head>
<body>

<header>
  <h1>🔧 <span id="hShop">อู่ซ่อมรถ</span> — ระบบจัดการร้าน</h1>
  <div class="sp"></div>
  <span id="today" style="font-size:13px"></span>
</header>

<nav>
  <button class="on" data-t="dash">หน้าหลัก</button>
  <button data-t="appt">📅 นัดหมาย</button>
  <button data-t="job">ใบงานซ่อม</button>
  <button data-t="cus">ลูกค้า &amp; รถ</button>
  <button data-t="part">สต็อกอะไหล่</button>
  <button data-t="rep">รายงาน</button>
  <button data-t="set">ตั้งค่า</button>
</nav>

<main>

<!-- ============ หน้าหลัก ============ -->
<section id="t-dash">
  <div class="kpi" id="kpi"></div>
  <div class="card"><h2>แจ้งเตือน</h2><div id="alerts"></div></div>
  <div class="card"><h2>งานที่ยังไม่ปิด</h2><div id="openJobs"></div></div>
</section>

<!-- ============ นัดหมาย ============ -->
<section id="t-appt" style="display:none">
  <div class="card">
    <h2>ตารางนัดหมาย / คิวซ่อม</h2>
    <div class="tools">
      <button class="b g" onclick="apEdit()">+ จองคิวใหม่</button>
      <button class="b s" onclick="goDate(today())">วันนี้</button>
      <input type="date" id="aDate" style="max-width:170px" onchange="renderAppt()">
      <select id="aFil" style="max-width:180px" onchange="renderAppt()">
        <option value="day">แสดงเฉพาะวันที่เลือก</option>
        <option value="up">นัดล่วงหน้าทั้งหมด</option>
        <option value="all">ทั้งหมด (รวมย้อนหลัง)</option>
      </select>
    </div>
    <div id="wkStrip" class="wk"></div>
    <div id="apCap"></div>
    <div id="apList"></div>
  </div>
</section>

<!-- ============ ใบงาน ============ -->
<section id="t-job" style="display:none">
  <div class="card">
    <h2>ใบงานซ่อม</h2>
    <div class="tools">
      <button class="b g" onclick="jobNew()">+ เปิดใบงานใหม่</button>
      <input id="qJob" placeholder="ค้นหา: เลขที่ / ทะเบียน / ชื่อลูกค้า" style="max-width:300px" oninput="renderJobs()">
      <select id="fStatus" style="max-width:170px" onchange="renderJobs()"><option value="">— ทุกสถานะ —</option></select>
    </div>
    <div id="jobList"></div>
  </div>
</section>

<!-- ============ ลูกค้า ============ -->
<section id="t-cus" style="display:none">
  <div class="card">
    <h2>ลูกค้า</h2>
    <div class="tools">
      <button class="b g" onclick="cusEdit()">+ เพิ่มลูกค้า</button>
      <input id="qCus" placeholder="ค้นหาชื่อ / เบอร์โทร" style="max-width:280px" oninput="renderCus()">
    </div>
    <div id="cusList"></div>
  </div>
  <div class="card">
    <h2>รถของลูกค้า</h2>
    <div class="tools">
      <button class="b g" onclick="vehEdit()">+ เพิ่มรถ</button>
      <input id="qVeh" placeholder="ค้นหาทะเบียน / ยี่ห้อ" style="max-width:280px" oninput="renderVeh()">
    </div>
    <div id="vehList"></div>
  </div>
</section>

<!-- ============ อะไหล่ ============ -->
<section id="t-part" style="display:none">
  <div class="card">
    <h2>สต็อกอะไหล่ &amp; สินค้า</h2>
    <div class="tools">
      <button class="b g" onclick="partEdit()">+ เพิ่มรายการ</button>
      <button class="b o" onclick="stockIn()">↓ รับของเข้า</button>
      <input id="qPart" placeholder="ค้นหารหัส / ชื่อ" style="max-width:280px" oninput="renderParts()">
      <label style="margin:0"><input type="checkbox" id="onlyLow" style="width:auto" onchange="renderParts()"> เฉพาะของใกล้หมด</label>
    </div>
    <div id="partList"></div>
  </div>
</section>

<!-- ============ รายงาน ============ -->
<section id="t-rep" style="display:none">
  <div class="card">
    <h2>สรุปยอดขาย</h2>
    <div class="row">
      <div class="col"><label>ตั้งแต่วันที่</label><input type="date" id="r1"></div>
      <div class="col"><label>ถึงวันที่</label><input type="date" id="r2"></div>
      <div class="col" style="display:flex;align-items:flex-end"><button class="b" onclick="renderRep()">ดูรายงาน</button></div>
    </div>
    <div id="repOut"></div>
  </div>
</section>

<!-- ============ ตั้งค่า ============ -->
<section id="t-set" style="display:none">
  <div class="card">
    <h2>ข้อมูลร้าน (ใช้พิมพ์บนเอกสาร)</h2>
    <div class="row">
      <div class="col"><label>ชื่อร้าน</label><input id="sName"></div>
      <div class="col"><label>เลขประจำตัวผู้เสียภาษี</label><input id="sTax"></div>
    </div>
    <div class="row">
      <div class="col"><label>ที่อยู่</label><input id="sAddr"></div>
      <div class="col"><label>โทรศัพท์</label><input id="sPhone"></div>
    </div>
    <div class="row">
      <div class="col"><label>อัตรา VAT (%)</label><input type="number" id="sVat" value="7"></div>
      <div class="col"><label>รูปแบบภาษี (ค่าเริ่มต้น)</label>
        <select id="sVatMode"><option value="ex">แยกนอก (ราคายังไม่รวม VAT)</option><option value="in">รวมใน (ราคารวม VAT แล้ว)</option><option value="no">ไม่คิด VAT</option></select></div>
      <div class="col"><label>แจ้งเตือนนัดเช็กระยะล่วงหน้า (วัน)</label><input type="number" id="sDue" value="30"></div>
    </div>
    <div class="row">
      <div class="col"><label>เวลาเปิดรับคิว</label><input type="time" id="sOpen" value="08:00"></div>
      <div class="col"><label>เวลาปิดรับคิว</label><input type="time" id="sClose" value="17:30"></div>
      <div class="col"><label>รับได้สูงสุด (คัน/วัน)</label><input type="number" id="sCap" value="8"></div>
      <div class="col"><label>คุณภาพรูปถ่าย</label>
        <select id="sImg"><option value="800">ประหยัดพื้นที่ (800px)</option><option value="1000">ปกติ (1000px)</option><option value="1400">ชัดสูง (1400px)</option></select></div>
    </div>
    <button class="b g" onclick="saveSet()">บันทึกการตั้งค่า</button>
  </div>
  <div class="card">
    <h2>สำรอง / กู้คืนข้อมูล</h2>
    <div id="stInfo"></div>
    <button class="b" onclick="backup()">⬇ สำรองข้อมูล (.json)</button>
    <button class="b o" onclick="document.getElementById('fRes').click()">⬆ กู้คืนข้อมูล (.json)</button>
    <input type="file" id="fRes" accept=".json" style="display:none" onchange="restore(this)">
    
    <button class="b g" onclick="exportExcelCSV()">📊 ส่งออกข้อมูล Excel (CSV)</button>
    <button class="b o" onclick="document.getElementById('fResExcel').click()">📥 นำเข้าข้อมูลจาก Excel (CSV)</button>
    <input type="file" id="fResExcel" accept=".csv" style="display:none" onchange="restoreExcelCSV(this)">

    <button class="b r" onclick="wipe()">ล้างข้อมูลทั้งหมด</button>
  </div>
  <div class="card">
    <h2>ช่างในร้าน</h2>
    <div class="tools"><input id="newTech" placeholder="ชื่อช่าง" style="max-width:220px"><button class="b g" onclick="addTech()">+ เพิ่ม</button></div>
    <div id="techList"></div>
  </div>
</section>

</main>

<div class="modal" id="mdl"><div class="box" id="mdlBox"></div></div>
<div class="modal" id="imgM" onclick="this.classList.remove('on')"><div style="margin:auto"><img id="imgBig" style="max-width:92vw;max-height:88vh;border-radius:8px"><div id="imgCap" style="color:#fff;text-align:center;margin-top:8px;font-size:14px"></div></div></div>
<div id="doc"></div>

<script>
/* ============ ฐานข้อมูล ============ */
const KEY='garage_db_v1';
let DB=JSON.parse(localStorage.getItem(KEY)||'null')||{
  settings:{},techs:['ช่างสมชาย','ช่างต้น','ช่างเอ'],
  customers:[],vehicles:[],parts:[],jobs:[],appts:[],counters:{job:1,ap:1}
};
/* --- migrate ให้ข้อมูลเก่าใช้ต่อได้ --- */
DB.appts=DB.appts||[];DB.counters=DB.counters||{};
DB.counters.job=DB.counters.job||1;DB.counters.ap=DB.counters.ap||1;
DB.jobs.forEach(j=>j.photos=j.photos||[]);
DB.settings=Object.assign({name:'อู่ช่างสมชายการช่าง',tax:'0000000000000',
 addr:'123 ถ.ตัวอย่าง ต.ในเมือง อ.เมือง จ.ขอนแก่น 40000',phone:'***-***-****',
 vat:7,vatMode:'ex',due:30,open:'08:00',close:'17:30',cap:8,imgMax:1000},DB.settings);

const ST=['รอตรวจเช็ก','รออะไหล่','กำลังซ่อม','ซ่อมเสร็จ','รับรถแล้ว','ยกเลิก'];
const STC={'รอตรวจเช็ก':'#6b7b90','รออะไหล่':'#e8911a','กำลังซ่อม':'#1b6ec2','ซ่อมเสร็จ':'#1e9e5a','รับรถแล้ว':'#10243e','ยกเลิก':'#c0392b'};
const AST=['จองแล้ว','ยืนยันแล้ว','มาแล้ว','ไม่มาตามนัด','ยกเลิก'];
const ASTC={'จองแล้ว':'#6b7b90','ยืนยันแล้ว':'#1b6ec2','มาแล้ว':'#1e9e5a','ไม่มาตามนัด':'#c0392b','ยกเลิก':'#95a5a6'};
const SRV=['เช็กระยะ/เปลี่ยนถ่ายน้ำมันเครื่อง','ซ่อมเครื่องยนต์','ระบบเบรก','ช่วงล่าง/โช้ค','ระบบไฟ-แบตเตอรี่','แอร์รถยนต์','ยาง/ตั้งศูนย์ถ่วงล้อ','ตรวจเช็กทั่วไป','เคาะพ่นสี','อื่น ๆ'];
const PTAG=['ก่อนซ่อม','ความเสียหาย','ระหว่างซ่อม','หลังซ่อม','อะไหล่เก่า','เอกสาร/ป้ายทะเบียน'];

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){alert('⚠ พื้นที่เก็บข้อมูลเต็ม! กรุณาสำรองไฟล์ แล้วลบรูปถ่ายของงานเก่าออกบ้างครับ');}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const n2=v=>(+v||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>fmt(new Date());
const addDay=(ds,n)=>{const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return fmt(d);};
const thDate=d=>{if(!d)return'-';const[y,m,dd]=d.split('-');return dd+'/'+m+'/'+(+y+543);};
const DOW=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const thFull=d=>{if(!d)return'-';const dt=new Date(d+'T12:00:00');return 'วัน'+DOW[dt.getDay()]+'ที่ '+thDate(d);};
const el=i=>document.getElementById(i);
const cus=id=>DB.customers.find(c=>c.id===id)||{};
const veh=id=>DB.vehicles.find(v=>v.id===id)||{};
const part=id=>DB.parts.find(p=>p.id===id)||{};
const openM=h=>{el('mdlBox').innerHTML=h;el('mdl').classList.add('on');};
const closeM=()=>el('mdl').classList.remove('on');
const bigImg=(src,cap)=>{el('imgBig').src=src;el('imgCap').textContent=cap||'';el('imgM').classList.add('on');};

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  ['dash','appt','job','cus','part','rep','set'].forEach(t=>el('t-'+t).style.display=t===b.dataset.t?'':'none');
  renderAll();
});

/* ============ คำนวณยอด ============ */
function calc(j){
  const gross=j.items.reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0);
  let sub=gross-(+j.discount||0);
  const r=(+DB.settings.vat||0)/100;let base=sub,vat=0,total=sub;
  if(j.vatMode==='ex'){vat=sub*r;total=sub+vat;}
  else if(j.vatMode==='in'){vat=sub*r/(1+r);base=sub-vat;}
  return{sub:gross,disc:+j.discount||0,base,vat,total};
}

/* ============ หน้าหลัก ============ */
function renderDash(){
  const open=DB.jobs.filter(j=>!['รับรถแล้ว','ยกเลิก'].includes(j.status));
  const td=DB.jobs.filter(j=>j.date===today());
  const income=DB.jobs.filter(j=>j.date===today()&&j.status!=='ยกเลิก').reduce((s,j)=>s+calc(j).total,0);
  const low=DB.parts.filter(p=>+p.qty<=+p.minQty);
  const apTd=DB.appts.filter(a=>a.date===today()&&!['ยกเลิก','ไม่มาตามนัด'].includes(a.status));
  el('kpi').innerHTML=`
   <div><label>งานค้างในอู่</label><b>${open.length}</b></div>
   <div class="ok"><label>นัดหมายวันนี้</label><b>${apTd.length}</b></div>
   <div class="ok"><label>รับรถเข้าวันนี้</label><b>${td.length}</b></div>
   <div class="ok"><label>ยอดขายวันนี้ (บาท)</label><b>${n2(income)}</b></div>
   <div class="${low.length?'warn':''}"><label>อะไหล่ใกล้หมด</label><b>${low.length}</b></div>`;

  let a='';
  const apSoon=DB.appts.filter(a=>(a.date===today()||a.date===addDay(today(),1))&&['จองแล้ว','ยืนยันแล้ว'].includes(a.status))
                        .sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
  if(apSoon.length) a+=`<div class="alert info"><b>📅 คิวนัดวันนี้ / พรุ่งนี้ (${apSoon.length})</b>
   <table><tr><th>วัน-เวลา</th><th>ลูกค้า</th><th>ทะเบียน</th><th>บริการ</th><th>สถานะ</th><th></th></tr>`+
   apSoon.map(a=>`<tr><td>${a.date===today()?'<b>วันนี้</b>':'พรุ่งนี้'} ${esc(a.time)}</td>
   <td>${esc(apName(a))}<br><small style="color:#5a6b80">${esc(apPhone(a))}</small></td>
   <td>${esc(apPlate(a))}</td><td>${esc(a.service)}</td>
   <td><span class="pill" style="background:${ASTC[a.status]}">${a.status}</span></td>
   <td style="white-space:nowrap"><button class="b o" onclick="apNotify('${a.id}')">เตือนลูกค้า</button>
   <button class="b g" onclick="apToJob('${a.id}')">รับรถ</button></td></tr>`).join('')+`</table></div>`;

  if(low.length) a+=`<div class="alert danger"><b>⚠ อะไหล่ต่ำกว่าจุดสั่งซื้อ ${low.length} รายการ</b><br>`+
    low.map(p=>`${esc(p.name)} (เหลือ ${p.qty} ${esc(p.unit)} / ขั้นต่ำ ${p.minQty})`).join(' · ')+`</div>`;

  const lim=addDay(today(),+DB.settings.due||30);
  const due=DB.jobs.filter(j=>j.nextDate&&j.nextDate<=lim&&j.status==='รับรถแล้ว');
  if(due.length) a+=`<div class="alert"><b>🔔 ถึงกำหนดนัดเช็กระยะ ${due.length} คัน</b><table><tr><th>ทะเบียน</th><th>ลูกค้า</th><th>นัดวันที่</th><th></th></tr>`+
    due.map(j=>`<tr><td>${esc(veh(j.vehId).plate)}</td><td>${esc(cus(j.custId).name)} (${esc(cus(j.custId).phone)})</td><td>${thDate(j.nextDate)}</td>
    <td style="white-space:nowrap"><button class="b o" onclick="notify('${j.id}','due')">ข้อความแจ้ง</button>
    <button class="b g" onclick="apEdit('',{custId:'${j.custId}',vehId:'${j.vehId}',date:'${j.nextDate}',service:'เช็กระยะ/เปลี่ยนถ่ายน้ำมันเครื่อง'})">จองคิวให้</button></td></tr>`).join('')+`</table></div>`;

  const rdy=DB.jobs.filter(j=>j.status==='ซ่อมเสร็จ');
  if(rdy.length) a+=`<div class="alert"><b>✅ ซ่อมเสร็จ รอลูกค้ามารับ ${rdy.length} คัน</b> — อย่าลืมแจ้งลูกค้า</div>`;
  el('alerts').innerHTML=a||'<p style="font-size:13px;color:#1e9e5a">ไม่มีแจ้งเตือน ทุกอย่างเรียบร้อย 👍</p>';
  el('openJobs').innerHTML=open.length?tbl(open):'<p style="font-size:13px;color:#5a6b80">ไม่มีงานค้าง</p>';
}

/* ============ นัดหมาย ============ */
const apName =a=>a.custId?cus(a.custId).name :(a.walkName||'-');
const apPhone=a=>a.custId?cus(a.custId).phone:(a.walkPhone||'-');
const apPlate=a=>a.vehId?veh(a.vehId).plate :(a.walkPlate||'-');
function goDate(d){el('aDate').value=d;el('aFil').value='day';renderAppt();}

function renderAppt(){
  if(!el('aDate').value)el('aDate').value=today();
  const base=el('aDate').value,mode=el('aFil').value;
  /* แถบ 7 วัน */
  let w='';
  for(let i=-1;i<6;i++){
    const ds=addDay(base,i),d=new Date(ds+'T12:00:00');
    const n=DB.appts.filter(a=>a.date===ds&&!['ยกเลิก','ไม่มาตามนัด'].includes(a.status)).length;
    const full=n>=(+DB.settings.cap||8);
    w+=`<div class="${ds===base?'sel':''} ${full?'hol':''}" onclick="goDate('${ds}')">
     ${DOW[d.getDay()].slice(0,2)} ${d.getDate()}/${d.getMonth()+1}<b>${n}</b>${full?'<span style="color:#c0392b">เต็ม</span>':'คิว'}</div>`;
  }
  el('wkStrip').innerHTML=w;

  let L=DB.appts.slice();
  if(mode==='day')L=L.filter(a=>a.date===base);
  else if(mode==='up')L=L.filter(a=>a.date>=today());
  L.sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));

  const cnt=DB.appts.filter(a=>a.date===base&&!['ยกเลิก','ไม่มาตามนัด'].includes(a.status)).length;
  el('apCap').innerHTML=mode==='day'
   ?`<div class="alert ${cnt>=(+DB.settings.cap||8)?'danger':'info'}">
      <b>${thFull(base)}</b> — จองแล้ว ${cnt} / ${DB.settings.cap} คิว
      ${cnt>=(+DB.settings.cap||8)?' ⚠ คิวเต็มแล้ว ควรเลื่อนลูกค้าไปวันถัดไป':''}</div>`:'';

  el('apList').innerHTML=L.length?L.map(a=>{
    const past=a.date<today();
    return `<div class="slot" style="border-left-color:${ASTC[a.status]};${past&&['จองแล้ว','ยืนยันแล้ว'].includes(a.status)?'background:#fff6f6':''}">
    <div class="t">${esc(a.time)}<div style="font-size:11px;font-weight:400;color:#5a6b80">${mode!=='day'?thDate(a.date):esc(a.no)}</div></div>
    <div style="min-width:190px"><b>${esc(apName(a))}</b><br><small style="color:#5a6b80">📞 ${esc(apPhone(a))}</small></div>
    <div style="min-width:120px">🚗 <b>${esc(apPlate(a))}</b><br><small style="color:#5a6b80">${esc(a.vehId?(veh(a.vehId).brand+' '+veh(a.vehId).model):(a.walkModel||''))}</small></div>
    <div style="min-width:190px">${esc(a.service)}<br><small style="color:#5a6b80">ช่าง: ${esc(a.tech||'-')} · ใช้เวลา ~${esc(a.dur||'1')} ชม.</small>
    ${a.note?`<br><small style="color:#e8911a">📝 ${esc(a.note)}</small>`:''}</div>
    <div class="sp"></div>
    <span class="pill" style="background:${ASTC[a.status]}">${a.status}</span>
    <div style="white-space:nowrap">
      ${a.jobId?`<button class="b" onclick="jobEdit('${a.jobId}')">ดูใบงาน</button>`
        :`<button class="b g" onclick="apToJob('${a.id}')">✓ รับรถ/เปิดงาน</button>`}
      <button class="b o" onclick="apNotify('${a.id}')">LINE</button>
      <button class="b" onclick="apEdit('${a.id}')">แก้ไข</button>
      <button class="b r" onclick="apDel('${a.id}')">ลบ</button>
    </div></div>`}).join('')
   :'<p style="font-size:13px;color:#5a6b80">ยังไม่มีนัดหมายในช่วงนี้</p>';
}

function apFillVeh(pre){
  const c=el('aC').value,L=DB.vehicles.filter(v=>v.custId===c);
  el('aV').innerHTML='<option value="">— เลือกรถ —</option>'+L.map(v=>`<option value="${v.id}" ${v.id===pre?'selected':''}>${esc(v.plate)} ${esc(v.brand||'')} ${esc(v.model||'')}</option>`).join('');
}
function apCapCheck(skip){
  const d=el('aD').value,n=DB.appts.filter(a=>a.date===d&&a.id!==skip&&!['ยกเลิก','ไม่มาตามนัด'].includes(a.status)).length;
  const cap=+DB.settings.cap||8;
  el('capMsg').innerHTML=n>=cap?`<div class="alert danger">⚠ วันที่ ${thDate(d)} มีคิวแล้ว ${n}/${cap} — <b>คิวเต็ม</b> แนะนำเลื่อนเป็นวันที่ ${thDate(addDay(d,1))}</div>`
    :`<div class="alert">วันที่ ${thDate(d)} มีคิวแล้ว ${n}/${cap} คิว — ยังรับได้อีก ${cap-n} คัน</div>`;
}
function apSave(id){
  const o={date:el('aD').value,time:el('aT').value,dur:+el('aDur').value,status:el('aS').value,
   custId:el('aC').value,vehId:el('aV').value,walkName:el('aWN').value.trim(),walkPhone:el('aWP').value.trim(),
   walkPlate:el('aWL').value.trim(),walkModel:el('aWM').value.trim(),service:el('aSv').value,
   tech:el('aTc').value,note:el('aN').value.trim()};
  if(!o.custId&&!o.walkName)return alert('กรุณาเลือกลูกค้าเดิม หรือกรอกชื่อลูกค้าใหม่');
  if(!o.date||!o.time)return alert('กรุณาระบุวันและเวลานัด');
  if(id)Object.assign(DB.appts.find(a=>a.id===id),o);
  else{DB.appts.push({id:uid(),no:'AP'+String(DB.counters.ap).padStart(5,'0'),jobId:'',...o});DB.counters.ap++;}
  save();closeM();renderAll();
}
function apDel(id){if(confirm('ยืนยันลบนัดหมายนี้?')){DB.appts=DB.appts.filter(a=>a.id!==id);save();renderAll();}}

/* สร้างใบงานจากนัดหมาย */
function apToJob(id){
  const a=DB.appts.find(x=>x.id===id);
  let cid=a.custId,vid=a.vehId;
  if(!cid){
    if(!confirm('ลูกค้ารายนี้ยังไม่มีในระบบ — สร้างประวัติลูกค้าและรถใหม่อัตโนมัติ?'))return;
    cid=uid();DB.customers.push({id:cid,name:a.walkName,phone:a.walkPhone,taxId:'',email:'',addr:''});
    vid=uid();const bm=(a.walkModel||'').split(' ');
    DB.vehicles.push({id:vid,custId:cid,plate:a.walkPlate||'-',brand:bm[0]||'',model:bm.slice(1).join(' '),year:'',color:'',vin:''});
    a.custId=cid;a.vehId=vid;
  }
  if(!vid)return alert('กรุณาแก้ไขนัดหมายแล้วเลือกรถก่อนครับ');
  a.status='มาแล้ว';
  jobNew({custId:cid,vehId:vid,symptom:a.service+(a.note?' — '+a.note:''),tech:a.tech||DB.techs[0]||'',apptId:a.id});
  save();
}

   `\nรบกวนมาถึงก่อนเวลานัดประมาณ 10 นาทีนะครับ\nหากไม่สะดวกตามวันเวลานี้ แจ้งเลื่อนล่วงหน้าได้ที่ ${s.phone}\n\nขอบคุณที่ใช้บริการครับ 🙏`;

function renderJobs(){
  const q=(el('qJob').value||'').toLowerCase(),f=el('fStatus').value;
  if(!el('fStatus').dataset.f){el('fStatus').innerHTML='<option value="">— ทุกสถานะ —</option>'+ST.map(s=>`<option>${s}</option>`).join('');el('fStatus').dataset.f=1;}
  let L=DB.jobs.slice().sort((a,b)=>b.no.localeCompare(a.no));
  if(f)L=L.filter(j=>j.status===f);
  if(q)L=L.filter(j=>(j.no+(veh(j.vehId).plate||'')+(cus(j.custId).name||'')).toLowerCase().includes(q));
  el('jobList').innerHTML=L.length?tbl(L):'<p style="font-size:13px;color:#5a6b80">ไม่พบข้อมูล</p>';
}

/* ---------- รูปถ่าย ---------- */
function initDrop(){
  const d=el('drop');if(!d)return;
  d.ondragover=e=>{e.preventDefault();d.classList.add('hot');};
  d.ondragleave=()=>d.classList.remove('hot');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('hot');handleFiles(e.dataTransfer.files);};
}
function addPhotos(inp){handleFiles(inp.files);inp.value='';}
function handleFiles(files){
  [...files].filter(f=>f.type.startsWith('image/')).forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const max=+DB.settings.imgMax||1000;let w=img.width,h=img.height;
        if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
        CUR.photos.push({id:uid(),data:cv.toDataURL('image/jpeg',0.62),tag:PTAG[0],cap:'',ts:new Date().toLocaleString('th-TH')});
        renderPhotos();
      };img.src=e.target.result;
    };r.readAsDataURL(f);
  });
}

  b.innerHTML=CUR.photos.length?CUR.photos.map((p,i)=>`<div class="ph">

function bahtText(num){
  const t=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],p=['','สิบ','ร้อย','พัน','หมื่น','แสน','ล้าน'];
  num=Math.round(num*100)/100;let[i,d]=num.toFixed(2).split('.');
  const conv=s=>{s=String(+s);if(s==='0')return'';let r='',L=s.length;
    for(let k=0;k<L;k++){const n=+s[k],pos=L-k-1;if(!n)continue;
      if(pos===0&&n===1&&L>1)r+='เอ็ด';else if(pos===1&&n===1)r+='';
      else if(pos===1&&n===2)r+='ยี่';else r+=t[n];r+=p[pos%6]||'';}
    return r;};
  let txt=i.length>6?conv(i.slice(0,-6))+'ล้าน'+conv(i.slice(-6)):conv(i);
  txt=(txt||'ศูนย์')+'บาท';
  txt+=(+d)?conv(d)+'สตางค์':'ถ้วน';
  return txt;
}

function restoreExcelCSV(inp){
  const f = inp.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = function(e){
    try {
      const text = e.target.result;
      const lines = text.split(/\r\n|\n/);
      let mode = '';
      let cCount = 0, vCount = 0, pCount = 0;
      let newCus = [], newVeh = [], newParts = [];

      lines.forEach(line => {
        if (!line.trim()) return;
        if (line.includes('=== ข้อมูลลูกค้า ===')) { mode = 'cus'; return; }
        if (line.includes('=== ข้อมูลรถ ===')) { mode = 'veh'; return; }
        if (line.includes('=== ข้อมูลอะไหล่ ===')) { mode = 'part'; return; }

        const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(s => s.replace(/^["=]+|["']+$/g, '').trim());
        if (mode === 'cus' && cols[0] && cols[0] !== 'รหัสลูกค้า') {
          newCus.push({ id: cols[0], name: cols[1], phone: cols[2], taxId: cols[3], email: cols[4], addr: cols[5] });
          cCount++;
        } else if (mode === 'veh' && cols[0] && cols[0] !== 'รหัสรถ') {
          newVeh.push({ id: cols[0], custId: cols[1], plate: cols[2], brand: cols[3], model: cols[4], year: cols[5], color: cols[6], vin: cols[7] });
          vCount++;
        } else if (mode === 'part' && cols[0] && cols[0] !== 'รหัสอะไหล่') {
          newParts.push({ id: uid(), code: cols[0], name: cols[1], unit: cols[2]||'ชิ้น', cost: Number(cols[3])||0, price: Number(cols[4])||0, qty: Number(cols[5])||0, minQty: Number(cols[6])||2 });
          pCount++;
        }
      });

      if (!confirm('ข้อมูลปัจจุบันจะถูกผสานหรือแทนที่ ยืนยันการนำเข้าข้อมูล Excel (CSV) หรือไม่?')) return;
      if (newCus.length > 0) DB.customers = newCus;
      if (newVeh.length > 0) DB.vehicles = newVeh;
      if (newParts.length > 0) DB.parts = newParts;

      save(); location.reload();
      alert(`นำเข้าข้อมูลสำเร็จ!\n- ลูกค้า: ${cCount} ราย\n- รถ: ${vCount} คัน\n- อะไหล่: ${pCount} รายการ`);
    } catch(err) {
      alert('เกิดข้อผิดพลาดในการอ่านไฟล์ กรุณาใช้ไฟล์ CSV ที่ส่งอกจากระบบเท่านั้น');
    }
  };
  rd.readAsText(f, 'UTF-8');
  inp.value = '';
}

/* ============ เริ่มต้น ============ */

<!-- ===================== ปรับหน้าเอกสาร: ตัดรูป/การชำระ/วันนัด + ย้ายจำนวนเงินตัวหนังสือ ===================== -->
<script>
(function(){
  const oldMenu=docMenu, oldDoc=makeDoc;

  /* เอาช่องติ๊ก "แนบรูปถ่ายท้ายเอกสาร" ออก */
  docMenu=function(id){
    oldMenu(id);
    const c=el('wPh'); if(c) c.closest('label').remove();
  };

  /* จัดหน้าเอกสารใหม่ */
  makeDoc=function(id,type){
    oldDoc(id,type);
    const paper=document.querySelector('#doc .paper'); if(!paper) return;
    const sum=paper.querySelector('table.sum'); if(!sum) return;

    // บรรทัดถัดจากตารางยอดเงิน = จำนวนเงินตัวหนังสือ
    const baht=sum.nextElementSibling; if(!baht) return;

    // ลบทุกอย่างระหว่างจำนวนเงินตัวหนังสือกับช่องลงชื่อ (ชำระโดย / นัดเช็กระยะ / รูปถ่าย)
    let n=baht.nextElementSibling;
    while(n && n.style.display!=='flex' && !n.classList.contains('noprint')){
      const next=n.nextElementSibling; n.remove(); n=next;
    }

    // ย้ายจำนวนเงินตัวหนังสือไปไว้ซ้ายมือ ข้างตารางยอดเงิน
    const box=document.createElement('div');
    box.style.cssText='display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-top:8px';
    sum.parentNode.insertBefore(box,sum);
    baht.style.cssText='flex:1;font-size:12px;text-align:center;padding-top:4px';
    sum.style.margin='0';
    box.appendChild(baht);
    box.appendChild(sum);
  };
})();
</script>
