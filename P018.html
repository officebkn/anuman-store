<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P018 MemoryNote</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{font-family:'Kanit',sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:#0f1115;color:#e2e8f0;display:flex;min-height:100vh}
.sidebar{width:240px;background:#15181e;padding:16px;display:flex;flex-direction:column;border-right:1px solid #1f242f}
.sidebar h2{font-size:18px;display:flex;align-items:center;gap:8px}
.menu{margin-top:20px}
.menu-item{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;color:#94a3b8;font-size:14px}
.menu-item.active{background:#1f242f;color:#fff}
.btn-new{margin-top:16px;padding:12px;background:#3b82f6;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600;width:100%}
.main{flex:1;padding:24px;background:#0f1115}
.top{display:flex;justify-content:space-between;align-items:center}
.search{padding:8px 14px;border-radius:20px;border:1px solid #1f242f;background:#15181e;color:#fff;width:300px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.card{background:#15181e;border:1px solid #1f242f;border-radius:14px;padding:16px}
.table{margin-top:20px;background:#15181e;border-radius:12px;padding:16px;border:1px solid #1f242f}
.row{display:grid;grid-template-columns:1fr 120px 120px;gap:8px;padding:12px 0;border-bottom:1px solid #1f242f;font-size:14px}
</style></head><body>
<div class="sidebar">
<h2><span style="background:#3b82f6;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center">M</span> MemoryNote</h2>
<div class="menu">
<div class="menu-item active">📊 Dashboard</div>
<div class="menu-item">📝 บันทึกทั้งหมด <span style="background:#1f242f;padding:2px 6px;border-radius:10px;font-size:11px" id="countAll">6</span></div>
<div class="menu-item">⏰ นัดหมาย <span style="background:#3b82f6;color:#fff;padding:2px 6px;border-radius:10px;font-size:11px">2</span></div>
<div class="menu-item">⭐ รายการสำคัญ</div>
<div class="menu-item">📁 หมวดหมู่</div>
<div class="menu-item">💾 สำรองข้อมูล</div>
</div>
<button class="btn-new" onclick="addNote()">+ เพิ่มบันทึกใหม่</button>
<div style="margin-top:auto;font-size:12px;color:#475569">v2.0 • Local Storage</div>
</div>
<div class="main">
<div class="top"><div><h1>สวัสดีครับ 👋</h1><p style="color:#94a3b8;font-size:14px">ภาพรวมบันทึกและรายการเตือนของคุณ</p></div><input class="search" id="search" placeholder="ค้นหาบันทึกหรือหมายเหตุ..."></div>
<div class="cards">
<div class="card"><div style="color:#94a3b8;font-size:13px">บันทึกทั้งหมด</div><b style="font-size:24px" id="cAll">6</b></div>
<div class="card"><div style="color:#94a3b8;font-size:13px">รายการเตือน</div><b style="font-size:24px">3</b></div>
<div class="card"><div style="color:#94a3b8;font-size:13px">นัดหมาย</div><b style="font-size:24px">2</b></div>
<div class="card"><div style="color:#94a3b8;font-size:13px">รายการสำคัญ</div><b style="font-size:24px" id="cImp">4</b></div>
</div>
<div class="table">
<div style="display:flex;justify-content:space-between;align-items:center"><h3>บันทึกล่าสุด</h3><button onclick="addNote()" style="padding:6px 12px;background:#1f242f;color:#fff;border:none;border-radius:8px;cursor:pointer">+ เพิ่ม</button></div>
<div id="notes" style="margin-top:12px"></div>
</div>
</div>
<script>
let notes=JSON.parse(localStorage.getItem('p018_notes')||'null')||[
{title:'โปรแกรมร้านค้า บริษัท C',code:'56666a',cat:'งาน',date:'18 ต.ค. 2569',important:true},
{title:'โปรแกรมร้านค้า บริษัท ค',code:'B 23333',cat:'งาน',date:'18 ต.ค. 2569',important:false},
{title:'โปรแกรมคนเดิน บริษัท ก.',code:'A123456',cat:'ส่วนตัว',date:'18 ต.ค. 2569',important:true},
{title:'ประชุมลูกค้าใหญ่',code:'MTG01',cat:'นัดหมาย',date:'19 ต.ค. 2569',important:true},
{title:'ไอเดียแอพใหม่',code:'IDEA9',cat:'ไอเดีย',date:'20 ต.ค. 2569',important:false},
{title:'รหัสผ่านเซิร์ฟเวอร์',code:'SRV-X',cat:'สำคัญ',date:'21 ต.ค. 2569',important:true}
];
function save(){localStorage.setItem('p018_notes',JSON.stringify(notes))}
function render(filter=''){
  const list=notes.filter(n=>n.title.toLowerCase().includes(filter.toLowerCase())||n.code.toLowerCase().includes(filter.toLowerCase()));
  document.getElementById('notes').innerHTML=list.map(n=>'<div class=row><span><b>'+n.title+'</b><br><span style=color:#64748b;font-size:12px>'+n.code+' • '+n.cat+'</span></span><span>'+n.date+'</span><span style="text-align:right">'+(n.important?'⭐':'')+' <span style=cursor:pointer onclick="delNote(\''+n.code+'\')">🗑</span></span></div>').join('');
  document.getElementById('cAll').textContent=notes.length; document.getElementById('countAll').textContent=notes.length; document.getElementById('cImp').textContent=notes.filter(n=>n.important).length;
}
function addNote(){
  const title=prompt('ชื่อบันทึก','บันทึกใหม่'); if(!title) return;
  const code=prompt('รหัส','CODE'+Math.floor(Math.random()*10000));
  const cat=prompt('หมวดหมู่','งาน'); const imp=confirm('สำคัญ?');
  notes.unshift({title,code,cat,date:new Date().toLocaleDateString('th-TH'),important:imp}); save();render(document.getElementById('search').value);
}
function delNote(code){notes=notes.filter(n=>n.code!==code);save();render(document.getElementById('search').value);}
document.getElementById('search').addEventListener('input',e=>render(e.target.value));
render();
</script></body></html>
