<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dormitory - P006</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet"><style>*{font-family:'Kanit',sans-serif;box-sizing:border-box;margin:0;padding:0}body{background:#f6f5ff;display:flex;height:100vh}aside{width:220px;background:#1e1b4b;color:#fff;padding:16px;display:flex;flex-direction:column;gap:6px}aside button{background:transparent;border:none;color:#a5b4fc;padding:8px 12px;text-align:left;border-radius:8px;cursor:pointer}aside button.active{background:#4338ca;color:#fff}main{flex:1;padding:16px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}.stat{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);display:flex;gap:12px;align-items:center}.icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:20px}.card{background:#fff;border-radius:14px;padding:14px;margin-top:12px}</style></head><body>
<aside><h3>🏠 ระบบหอพัก</h3><button class="active">แดชบอร์ด</button><button>จัดการห้อง (50)</button><button>ผู้เช่า</button><button>บิลค่าเช่า</button><button>แจ้งซ่อม</button><button>ตั้งค่า</button><div style="margin-top:auto;font-size:12px;color:#a5b4fc">50 ห้อง • 0 ผู้เช่า</div></aside>
<main>
<div class="grid">
<div class="stat"><div class="icon" style="background:#22c55e">🏠</div><div><small>ห้องว่าง</small><b style="display:block;font-size:20px" id="vacant">50</b></div></div>
<div class="stat"><div class="icon" style="background:#3b82f6">👤</div><div><small>ผู้เช่า</small><b style="display:block;font-size:20px" id="tenants">0</b></div></div>
<div class="stat"><div class="icon" style="background:#ef4444">⏰</div><div><small>บิลค้าง</small><b style="display:block;font-size:20px" id="overdue">0</b></div></div>
<div class="stat"><div class="icon" style="background:#8b5cf6">💰</div><div><small>รายรับ</small><b style="display:block;font-size:20px"><span id="rev">0.00</span> THB</b></div></div>
</div>
<div class="card"><div style="display:flex;justify-content:space-between"><h3>สรุปบิล</h3><button onclick="addTenant()" style="background:#4338ca;color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer">+ เพิ่มผู้เช่า</button></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0"><div style="background:#f5f3ff;padding:10px;border-radius:10px;text-align:center">ยอดบิลทั้งหมด<br><b id="totalBill">0.00฿</b></div><div style="background:#ecfdf5;padding:10px;border-radius:10px;text-align:center">รับชำระแล้ว<br><b id="paid">0.00</b></div><div style="background:#fef2f2;padding:10px;border-radius:10px;text-align:center">ค้างชำระ<br><b id="unpaid">0.00</b></div></div><div id="bills" style="text-align:center;color:#888;padding:20px">ไม่มีบิลเกินกำหนด</div></div>
</main>
<script>
let tenants=[],bills=[];
function render(){document.getElementById('vacant').textContent=50-tenants.length;document.getElementById('tenants').textContent=tenants.length;document.getElementById('overdue').textContent=bills.filter(b=>b.status==='ค้าง').length;let total=bills.reduce((s,b)=>s+b.amount,0);document.getElementById('totalBill').textContent=total.toFixed(2)+'฿';document.getElementById('paid').textContent=bills.filter(b=>b.status==='จ่ายแล้ว').reduce((s,b)=>s+b.amount,0).toFixed(2);document.getElementById('unpaid').textContent=bills.filter(b=>b.status==='ค้าง').reduce((s,b)=>s+b.amount,0).toFixed(2);document.getElementById('rev').textContent=bills.filter(b=>b.status==='จ่ายแล้ว').reduce((s,b)=>s+b.amount,0).toFixed(2);document.getElementById('bills').innerHTML=bills.length?bills.map(b=>'<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><span>'+b.room+' - '+b.name+' ('+b.amount+'฿)</span><span style="background:'+(b.status==='จ่ายแล้ว'?'#dcfce7':'#fee2e2')+';padding:2px 8px;border-radius:10px;font-size:12px">'+b.status+'</span></div>').join(''):'<div style="text-align:center;color:#888;padding:20px">ไม่มีบิลเกินกำหนด</div>';}
function addTenant(){const name=prompt('ชื่อผู้เช่า');if(!name)return;const room=prompt('ห้อง (1-50)');tenants.push({name,room});bills.push({room:'ห้อง '+room,name,amount:3500,status:'ค้าง'});render();}
render();
</script></body></html>
